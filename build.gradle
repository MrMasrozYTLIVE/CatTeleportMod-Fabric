import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
	id("net.fabricmc.fabric-loom") version("1.16-SNAPSHOT")
	id("com.hypherionmc.modutils.modpublisher") version("2.2.1+snapshot.0")
}

//sourceCompatibility = JavaVersion.VERSION_21
//targetCompatibility = JavaVersion.VERSION_21
//
//archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases" }
	maven { url "https://maven.fabricmc.net/" }
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
//    api("me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version}") {
    api("maven.modrinth:cloth-config:${clothconfig_version}") {
            exclude(group: "net.fabricmc.fabric-api")
	}
//    implementation "com.terraformersmc:modmenu:${modmenu_version}"
    implementation "maven.modrinth:modmenu:${modmenu_version}"
    implementation "maven.modrinth:autoreconnectrf:${autoreconnectrf_version}"

	implementation "javax.annotation:javax.annotation-api:1.3.2"
	implementation 'com.google.code.findbugs:jsr305:3.0.2'

	compileOnly "org.projectlombok:lombok:${lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${lombok_version}"
}

processResources {
	def expandProps = [
			"version": project.version,
			"loader_version": loader_version,
			"minecraft_version": minecraft_versions.split(" ").first(),
			"clothconfig_version": clothconfig_version,
			"clothconfig_actual_version": clothconfig_actual_version
	]

	filesMatching("fabric.mod.json") {
		expand expandProps
	}

	inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.archives_base_name}" }
	}
	manifest {
		attributes([
				"Specification-Title"     : "CatTeleportMod",
				"Specification-Vendor"    : "MiTask",
				"Specification-Version"   : project.jar.archiveVersion,
				"Implementation-Title"    : project.name,
				"Implementation-Version"  : project.jar.archiveVersion,
				"Implementation-Vendor"   : "MiTask",
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
				"Timestamp"               : System.currentTimeMillis(),
				"Built-On-Java"           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
				"Built-On-Minecraft"      : minecraft_version
		])
	}
}

publisher {
	apiKeys {
		modrinth System.getenv().MODRINTH_TOKEN
		curseforge System.getenv().CURSEFORGE_TOKEN
		github System.getenv().GITHUB_TOKEN
	}

	setCurseID(curseforge_id)
	setModrinthID(modrinth_id)

	setVersionType(release_type)
	setChangelog(file("changelog.md"))

	setProjectVersion(mod_version)
	setDisplayName("CatTeleportMod ${mod_version}")

	setGameVersions(List.of(minecraft_versions.split(" ")))

	setLoaders(ModLoader.FABRIC, ModLoader.QUILT)
	setCurseEnvironment("client")

	setArtifact(jar)

	setDisableMalwareScanner(true)

	setJavaVersions(List.of(JavaVersion.VERSION_25))
	setDisableEmptyJarCheck(true)

	github {
		repo = "MrMasrozYTLIVE/CatTeleportMod-Fabric"
		tag = "CatTeleportMod-${mod_version}"
		target = "master"
		draft = false
	}

	modrinthDepends {
		required "fabric-api", "cloth-config"
		optional 'modmenu'
	}

	curseDepends {
		required "fabric-api", "cloth-config"
		optional 'modmenu'
	}
}